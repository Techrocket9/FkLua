name: api-regen

# The weekly regeneration bot.
#
# Polls lua-api.factorio.com for a release newer than anything committed, and if
# it finds one opens a PR containing the pulled JSON, a regenerated census and
# the classified diff as the PR body.
#
# The BINDINGS in that PR are usually unchanged, and that is not a bug. They are
# generated from factorio.DefaultAPIVersion, which is a committed pin a human
# moves; the bot pulls a version alongside it and shows what moved. Regenerating
# runs anyway so that a pin bumped by hand in the same PR is never stale.
#
# WHAT A HUMAN IS FOR: reading the breaking list. Everything else here is
# mechanical, and the point of `api diff`'s classification is that the review is
# bounded — a reviewer reads the Breaking section and nothing else.
#
# This is the one job in the repo that is allowed to reach the network, and it
# reaches it exactly once, to fetch a JSON file. Nothing it opens a PR for is
# ever built against the network: the JSON lands in the tree first.

on:
  schedule:
    # Mondays, early UTC. Nothing about this is urgent -- a Factorio release is
    # not an incident, and the diff is the same on Monday as it was on Saturday.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pull (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build fklua
        run: go build -o bin/fklua ./cmd/fklua

      # `api list --current` and not `api list | awk '/^\*/'`: the table is a
      # human-facing presentation and its trailing legend line ("* is the
      # version the committed bindings are generated from") starts with the very
      # character that awk was keying on, so the step wrote TWO lines into
      # $GITHUB_OUTPUT and the job died on `Invalid format 'is'`.
      - name: Record what we already have
        id: before
        run: echo "current=$(./bin/fklua api list --current)" >> "$GITHUB_OUTPUT"

      - name: Pull the target version
        id: pull
        run: |
          set -euo pipefail
          ./bin/fklua api pull "${{ inputs.version || 'latest' }}" | tee /tmp/pull.log
          # `latest` resolves to whatever shipped most recently, so the version
          # comes from what the pull WROTE rather than from the input -- api pull
          # already files it under the resolved name and says so when they
          # differ. Asking git rather than taking the highest directory on disk,
          # because those are the same answer only when the pulled version is
          # also the newest one committed: a hand-dispatched older version would
          # otherwise be diffed and branched under somebody else's number.
          # --porcelain is git's stable machine format, and it is the same
          # question the next step asks, so the two cannot disagree. Empty means
          # the pull changed nothing, which the next step turns into a no-op.
          NEW=$(git status --porcelain -- api/ | awk -F/ '{print $2}' | sort -u)
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      # A GATE THAT CANNOT FAIL IS WORSE THAN A GATE NOBODY ADDED. This asked
      # `git diff --quiet -- api/`, and a version this repo has never seen
      # arrives as a whole new UNTRACKED directory -- which git diff does not
      # report. So the one gate whose job is to notice a new release was
      # structurally unable to see one: it would have said "nothing to do" and
      # exited GREEN on exactly the week the bot exists for. The pull step's
      # output is derived from the same `git status`, so this reads it rather
      # than asking a second time and risking a second answer.
      - name: Stop if nothing is new
        id: check
        run: |
          if [ -z "${{ steps.pull.outputs.version }}" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "No API version newer than what is committed. Nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # Everything below only runs when there is genuinely something new, so a
      # quiet week costs one HTTP request and no PR noise.
      #
      # THIS STEP NOW TOUCHES THE PULLED VERSION, which is why it may fail and
      # why failing must not block the PR. Since 2026-08-24 gen-bindings takes a
      # census of every description the checkout owns rather than of the pin
      # alone -- so the version this job just pulled arrives WITH its census
      # instead of without one, which is what 2.1.12 sat committed and
      # censusless for. The other half of that is that the generators now have
      # to read a description no human has looked at yet, and a release they
      # cannot absorb turns this step red where before it was untouched.
      #
      # A red run here is exactly what the Test step's comment below says about
      # itself: the interesting failure, and the one a human most needs to see.
      # So it is `continue-on-error` for the same reason, and its outcome joins
      # the draft condition. The PR then carries a partially regenerated tree,
      # which is a draft's job.
      - name: Regenerate bindings and census
        if: steps.check.outputs.new == 'true'
        continue-on-error: true
        id: regen
        run: ./bin/fklua gen-bindings

      - name: Classify the change
        if: steps.check.outputs.new == 'true'
        run: |
          ./bin/fklua api diff "${{ steps.before.outputs.current }}" \
            "${{ steps.pull.outputs.version }}" > /tmp/diff.md
          ./bin/fklua api diff "${{ steps.before.outputs.current }}" \
            "${{ steps.pull.outputs.version }}" --json /tmp/diff.json || true

      # The suite runs against the OLD pin, which is what the committed bindings
      # are still generated from. A red run here means the generators could not
      # absorb the new description -- which is the interesting failure, and the
      # PR should carry it rather than be blocked by it.
      - name: Test
        if: steps.check.outputs.new == 'true'
        continue-on-error: true
        id: tests
        run: go test ./...

      - name: Open the PR
        if: steps.check.outputs.new == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: api/${{ steps.pull.outputs.version }}
          title: "api: Factorio ${{ steps.pull.outputs.version }}"
          commit-message: |
            api: pull Factorio ${{ steps.pull.outputs.version }} and regenerate

            Opened by the weekly regeneration bot. The classified diff is in the
            PR body; a reviewer reads the Breaking section and nothing else.
          body-path: /tmp/diff.md
          labels: api-upgrade
          draft: ${{ steps.tests.outcome == 'failure' || steps.regen.outcome == 'failure' }}
