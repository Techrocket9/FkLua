# The Rust guest workspace.
#
# One workspace so `cargo build` from here builds the substrate and every
# example against the same lockfile, the way guest/go is one module.
[workspace]
resolver = "2"
members = ["fk", "fkgc", "fkapi", "fkipc", "fkdata", "fklog", "examples/hello", "examples/array", "examples/api", "examples/gctorture", "examples/gcsave", "examples/gcconfig", "examples/dict", "examples/dynread", "examples/typedargs", "examples/logdump", "examples/handles", "examples/lasterror", "examples/ipc", "examples/demo-circle", "examples/datastage"]

# Every guest ships as a cdylib into a game's tick loop, so the profile is not
# a preference. panic=abort because there is no unwinding across the wasm
# boundary -- FkLua compiles a trap, and a Factorio mod that unwinds mid-tick
# has nowhere to unwind to. opt-level="s" and lto because the generated Lua is
# parsed by the game at load, so module size is load time.
#
# debug = "line-tables-only" is what puts a source file and line into
# fk_module.map.json, so a Lua stack frame can be read back to the Rust it came
# from. It costs wasm size and NOT ONE BYTE of generated Lua: rustc emits the
# same code section either way, and the debug info rides in custom sections the
# compiler reads and drops. debug = true covers every function instead of most
# of them, for a much larger wasm. The scaffold cmd/fklua/scaffold.go writes
# carries the same four lines and the same key; the two are meant to match.
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
debug = "line-tables-only"
